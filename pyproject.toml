[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-lab"
version = "0.2.0"
description = "Detect and clean AI-generated text artifacts (Latin + Arabic) and statistical watermarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sidy Cissokho"}]
dependencies = [
    "transformers>=5.0",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "pandas>=2.0"]
dev   = ["pytest>=7.0", "pytest-cov>=5.0"]

[project.scripts]
ai-text-lab = "src.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["ai_text_lab"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/backtranslation_attack.py",
    "src/generate_watermarked.py",
    "src/greenlist_detector.py",
    "src/paraphrase_attack.py",
    "src/plot_all.py",
    "src/plot_comparison.py",
    "src/plot_cross_model.py",
    "src/plot_results.py",
    "src/run_calibration.py",
    "src/run_robustness.py",
    "src/synthid_attacks.py",
    "src/synthid_calibration.py",
    "src/synthid_detector.py",
    "src/synthid_generate_watermarked.py",
    "src/synthid_robustness.py",
    "src/synthid_smoke_test.py",
    "src/tinyllama_all.py",
    "src/tinyllama_synthid_resume.py",
    "src/qwen_all.py",`n    "src/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
